services:
  postgres:
    # pgvector/pgvector:pg16 — same Postgres 16 binaries/data format as
    # postgres:16-alpine, just with the `vector` extension pre-built (plain
    # postgres:16-alpine ships none at all — confirmed live before
    # apps/ai-service was scaffolded; see docs/decisions/0011). Additive to
    # the existing volume, same "no data-directory reinit needed" class of
    # change as the wal_level setting below.
    image: pgvector/pgvector:pg16
    container_name: folkshops-postgres
    restart: unless-stopped
    # wal_level=logical + the replication-slot/sender limits are what make
    # Debezium's CDC pipeline possible at all (docs/decisions/0009) — a
    # postmaster-level setting, not something a migration can SET; takes
    # effect on the next Postgres restart (docker recreates the container),
    # no data-directory reinit needed. max_slot_wal_keep_size bounds WAL
    # retention if the Debezium connector is ever down for a long time (see
    # the ADR's Failure modes) — past that limit the slot becomes invalid
    # and needs a full re-snapshot, a documented dev-acceptable tradeoff.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10", "-c", "max_slot_wal_keep_size=2GB"]
    environment:
      POSTGRES_USER: folkshops
      POSTGRES_PASSWORD: folkshops
      POSTGRES_DB: folkshops_dev
    ports:
      - "5432:5432"
    volumes:
      - folkshops-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folkshops -d folkshops_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: folkshops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - folkshops-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible local dev target for product image uploads — same
  # swap-seam pattern as ConsoleOtpProvider: real S3 SDK calls
  # (@aws-sdk/client-s3) against a local backend in dev, a real AWS bucket
  # in prod, purely by changing AWS_S3_ENDPOINT/credentials in env. No
  # code branches on "am I local or real S3" — the SDK doesn't care.
  minio:
    image: minio/minio:latest
    container_name: folkshops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: folkshops
      MINIO_ROOT_PASSWORD: folkshops123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console (http://localhost:9001)
    volumes:
      - folkshops-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket and makes it anonymously downloadable
  # (so <img src> works directly against MinIO, the way a real public S3
  # bucket or CDN in front of one would) — then exits. Runs every
  # `docker compose up`; idempotent (mb -p, anonymous set both no-op if
  # already done).
  minio-init:
    image: minio/mc:latest
    container_name: folkshops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 folkshops folkshops123 &&
      mc mb -p local/folkshops-uploads &&
      mc anonymous set download local/folkshops-uploads
      "
    restart: "no"

  # Analytics/search pipeline (docs/decisions/0009) — a deliberate,
  # user-approved pull-forward of Phase 5 infrastructure. Startup order is
  # entirely expressed via depends_on/condition below, same chain shape as
  # minio -> minio-init -> core-api above: kafka -> kafka-init -> kafka-connect
  # -> debezium-connector-init, elasticsearch independent. apps/analytics
  # can run either natively (`pnpm --filter @folkshops/analytics-api dev`)
  # or as the optional `analytics` service further down; apps/workers is
  # still native-only.
  kafka:
    image: apache/kafka:3.8.0
    container_name: folkshops-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: PLAINTEXT for the host (native `pnpm dev`
      # processes — apps/workers, apps/analytics), CONTROLLER for KRaft's
      # own quorum traffic, DOCKER for other containers (kafka-connect) —
      # same "container-network hostname vs localhost" split as core-api's
      # own DATABASE_PRIMARY_URL override elsewhere in this file.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: folkshops-dev-cluster
    volumes:
      - folkshops-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  # One-shot: pre-creates the 5 topics (business events + CDC) so
  # allowAutoTopicCreation:false in every kafkajs producer/consumer is
  # safe — a mistyped topic name fails loudly instead of silently
  # auto-creating a stray topic. --if-not-exists = idempotent, same
  # pattern as minio-init above.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: folkshops-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      for t in folkshops.events.order folkshops.events.payment folkshops.events.cart folkshops.cdc.products folkshops.cdc.categories; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9094 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1;
      done
      "
    restart: "no"

  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: folkshops-kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9094
      GROUP_ID: folkshops-connect-cluster
      CONFIG_STORAGE_TOPIC: folkshops_connect_configs
      OFFSET_STORAGE_TOPIC: folkshops_connect_offsets
      STATUS_STORAGE_TOPIC: folkshops_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 15

  # One-shot: registers the Postgres connector via Kafka Connect's REST API
  # once it's healthy. PUT (Connect's documented upsert), not POST — safe
  # to re-run on every `docker compose up`, never creates a duplicate
  # connector. DEBEZIUM_DB_PASSWORD must match whatever
  # folkshops_debezium's actual password is (dev-only fixed value from
  # database/init/01-app-role.sql unless overridden).
  debezium-connector-init:
    image: curlimages/curl:8.11.0
    container_name: folkshops-debezium-connector-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./database/debezium/postgres-connector.json:/config/postgres-connector.json:ro
    environment:
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:-folkshops_debezium}
    entrypoint: >
      /bin/sh -c "
      sed \"s/\\$${DEBEZIUM_DB_PASSWORD}/$$DEBEZIUM_DB_PASSWORD/\" /config/postgres-connector.json > /tmp/connector.json &&
      curl -sf -X PUT http://kafka-connect:8083/connectors/folkshops-postgres-connector/config -H 'Content-Type: application/json' -d @/tmp/connector.json
      "
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: folkshops-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Dev only — see apps/analytics/README.md for the prod posture (TLS +
      # auth, never exposed publicly). Elasticsearch/Kafka are both
      # internal-only in this compose file (no browser ever talks to
      # either directly — apps/analytics is the sole client of both).
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - folkshops-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Optional — `pnpm --filter @folkshops/core-api dev` on the host works
  # exactly as before and is unaffected by this. This exists purely so
  # `docker compose up -d` can also cover the backend for anyone who'd
  # rather not run a separate terminal for it. The four Next.js frontends
  # are deliberately NOT containerized — Next's dev server hot-reloads
  # better run natively, and there's no reason to add that complexity here.
  core-api:
    build:
      context: .
      dockerfile: apps/core-api/Dockerfile
    container_name: folkshops-core-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # env_file loads everything in apps/core-api/.env first (this is how
    # RAZORPAY_KEY_ID/SECRET/WEBHOOK_SECRET reach the container — they're
    # not duplicated below); the explicit `environment:` block below still
    # wins for any key both define (compose's own precedence), which is
    # exactly why DATABASE_PRIMARY_URL etc. below can safely differ from
    # what .env has for native `pnpm dev` (container-network hostnames vs
    # localhost) without env_file silently overriding them.
    env_file:
      - apps/core-api/.env
    environment:
      NODE_ENV: development
      PORT: 4000
      # pnpm's own automatic pre-script dependency check wants to purge
      # and reinstall node_modules whenever the named volume's contents
      # look out of sync with package.json/the lockfile (e.g. right after
      # a new dependency is added) — and refuses to do that purge
      # non-interactively, since `docker compose up -d` allocates no TTY.
      # CI=true is pnpm's own documented way to skip that interactive
      # confirmation (see the ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
      # error message itself) — CLAUDE.md bug #16's volume-nuke workaround
      # is still occasionally needed for a truly stale volume, but this
      # stops the *non-interactive-prompt* failure mode from recurring.
      CI: "true"
      # Container-network hostnames (service names), not localhost — these
      # only apply inside this container. Native `pnpm dev` on the host
      # still reads apps/core-api/.env, which correctly uses localhost.
      DATABASE_PRIMARY_URL: postgres://folkshops_app:folkshops_app@postgres:5432/folkshops_dev
      DATABASE_REPLICA_URL: postgres://folkshops_app:folkshops_app@postgres:5432/folkshops_dev
      MIGRATIONS_DATABASE_URL: postgres://folkshops:folkshops@postgres:5432/folkshops_dev
      REDIS_URL: redis://redis:6379
      CACHE_STORE_TTL_SECONDS: 300
      CACHE_PRODUCTS_LIST_TTL_SECONDS: 30
      # Product search (ProductSearchService) reads the same index
      # apps/analytics maintains. Optional — unreachable just means search
      # falls back to the old name ILIKE.
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: dev-only-change-me
      PLATFORM_ADMIN_JWT_SECRET: dev-only-change-me-too
      CUSTOMER_JWT_SECRET: dev-only-change-me-three
      INTERNAL_SERVICE_TOKEN: dev-only-internal-service-token
      CORS_ORIGINS: http://localhost:3000,http://*.localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      # AWS_S3_ENDPOINT is what makes this MinIO instead of real AWS — see
      # S3Service's own comment. AWS_S3_PUBLIC_URL is what browsers use
      # (localhost:9000, since the container-network "minio" hostname
      # means nothing outside Docker); unset both in prod for real S3.
      AWS_S3_BUCKET: folkshops-uploads
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: folkshops
      AWS_SECRET_ACCESS_KEY: folkshops123
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_PUBLIC_URL: http://localhost:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "4000:4000"
    volumes:
      # Bind-mount the repo for hot reload, but keep node_modules as named
      # volumes so the container's own Linux-built modules (native
      # bindings like bcrypt) aren't clobbered by the host's — e.g. macOS
      # — node_modules through the mount above.
      - .:/app
      - core-api-root-node-modules:/app/node_modules
      - core-api-app-node-modules:/app/apps/core-api/node_modules

  # Optional, same posture as core-api above — `pnpm --filter
  # @folkshops/analytics-api dev` on the host works identically (don't run
  # both, port 4100 conflict). Every env var is set explicitly below rather
  # than via env_file, so apps/analytics/.env isn't required to exist for
  # the container; the values differ from .env only in using container-
  # network hostnames (kafka:9094 — the DOCKER listener — elasticsearch,
  # redis) instead of localhost.
  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    container_name: folkshops-analytics
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4100
      # Same reason as core-api's CI flag above (bug #16).
      CI: "true"
      KAFKA_BROKERS: kafka:9094
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379
      # MUST match core-api's JWT_SECRET above — verifies the same staff
      # access tokens core-api issues.
      JWT_SECRET: dev-only-change-me
      CORS_ORIGINS: http://localhost:3001
    ports:
      - "4100:4100"
    volumes:
      # Deliberately NOT core-api's whole-repo `.:/app` mount: pnpm's
      # startup install is workspace-wide, and with the whole repo mounted
      # it writes Linux node_modules into every *other* package on the host
      # (CLAUDE.md bug #16's side effect — reproduced live when this service
      # was added). Mounting only the two directories hot reload actually
      # needs keeps everything else inside the image, so that install can
      # never reach the host. Each mount's node_modules is a named volume
      # for the same reason core-api's are.
      - ./apps/analytics:/app/apps/analytics
      - ./packages/events:/app/packages/events
      - analytics-app-node-modules:/app/apps/analytics/node_modules
      - analytics-events-node-modules:/app/packages/events/node_modules

  # Optional, same posture as core-api above — native `uvicorn`/`arq` on the
  # host (see apps/ai-service/README.md) works identically and is the
  # faster dev loop. folkshops_ai (database/init/02-ai-role.sql) is created
  # on a fresh volume automatically via the same docker-entrypoint-initdb.d
  # mount postgres already uses; on an existing volume, run
  # scripts/bootstrap_ai_role.py once first (see that script's docstring).
  ai-service:
    build:
      context: apps/ai-service
      dockerfile: Dockerfile
    container_name: folkshops-ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/ai-service/.env
    environment:
      APP_ENV: development
      PORT: 4400
      DATABASE_URL: postgres://folkshops_ai:folkshops_ai@postgres:5432/folkshops_dev
      MIGRATIONS_DATABASE_URL: postgres://folkshops:folkshops@postgres:5432/folkshops_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-only-change-me
      CUSTOMER_JWT_SECRET: dev-only-change-me-three
      PLATFORM_ADMIN_JWT_SECRET: dev-only-change-me-too
      CORS_ORIGINS: http://localhost:3001,http://localhost:3002
      KAFKA_BROKERS: kafka:9094
      HF_HOME: /models
      # The agent's MCP tools (core-api /internal/mcp/*), over the compose network.
      CORE_API_URL: http://core-api:4000
      INTERNAL_SERVICE_TOKEN: dev-only-internal-service-token
    ports:
      - "4400:4400"
    # Local embedding model cache (EMBEDDING_PROVIDER=local) — shared with
    # ai-worker and kept across rebuilds, so the model downloads once.
    volumes:
      - ai-model-cache:/models

  # The arq ingestion worker — same image, different command. Without it an
  # uploaded knowledge-base document never leaves "uploaded" (parse/chunk/
  # embed only ever run here, never in the API request).
  ai-worker:
    build:
      context: apps/ai-service
      dockerfile: Dockerfile
    container_name: folkshops-ai-worker
    restart: unless-stopped
    command: ["arq", "app.workers.document_worker.WorkerSettings"]
    healthcheck:
      disable: true
    depends_on:
      ai-service:
        condition: service_healthy
    env_file:
      - apps/ai-service/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://folkshops_ai:folkshops_ai@postgres:5432/folkshops_dev
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9094
      HF_HOME: /models
    volumes:
      - ai-model-cache:/models

volumes:
  folkshops-postgres-data:
  folkshops-redis-data:
  folkshops-minio-data:
  folkshops-kafka-data:
  folkshops-es-data:
  core-api-root-node-modules:
  core-api-app-node-modules:
  analytics-app-node-modules:
  analytics-events-node-modules:
  ai-model-cache:
