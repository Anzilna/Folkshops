[project]
name = "folkshops-ai-service"
version = "0.1.0"
description = "Folkshops AI/RAG service — Shopper AI + Merchant Copilot (Phase 3, pulled forward per docs/decisions/0011)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP042",  # str+Enum (not StrEnum) is deliberate — matches Pydantic's own documented enum pattern
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
ignore_missing_imports = true
